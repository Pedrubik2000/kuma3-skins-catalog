<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Joker XP</title>
<style>
/* Anki XP's game (XP, combo, goal, quests, boss cards, trophies) dressed as a Balatro table like Anki Joker:
   swirling felt, a slate side panel with Chips × Mult, chunky coloured buttons, scanlines. */
:root{--chips:#009dff;--mult:#fe5f55;--gold:#f5b244;--green:#4bc292;--orange:#fda200;--panel:#3a5055;--inner:#1e2b2d;
  --edge:#5d7377;--ink:#fff;--dim:#a9b8ba;--new:#7f9cff;--learn:#e06060;--due:#7fbf6a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#1a3a2a;color:var(--ink);font:900 16px/1.15 "Trebuchet MS","Roboto Condensed",Roboto,system-ui,sans-serif;
  overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent;text-shadow:0 2px 0 rgba(0,0,0,.35)}
#bg{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:0}
#app{position:relative;z-index:1;height:100dvh;display:flex;padding:8px;gap:8px}
button,.btn{font:inherit;color:#fff;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;text-shadow:inherit;background:var(--chips);
  box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .05s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.b-blue{background:var(--chips)}.b-red{background:var(--mult)}.b-orange{background:var(--orange)}.b-green{background:var(--green)}.b-gold{background:var(--gold)}.b-grey{background:#566}
.btn small{display:block;font-size:12px;color:rgba(255,255,255,.8)}
[data-r="1"]{background:var(--mult)}[data-r="2"]{background:var(--orange)}[data-r="3"]{background:var(--chips)}[data-r="4"]{background:var(--green)}
.row-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;flex:none}
.row-btns .btn{flex:1;max-width:170px;min-height:52px;font-size:17px}
.panel,.sunken{background:var(--panel);border:2px solid var(--edge);border-radius:12px;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.box{background:var(--inner);border-radius:10px;padding:6px 8px}
small{font-size:12px;color:var(--dim)}
.c-new{color:var(--new)}.c-learn{color:var(--learn)}.c-due{color:var(--due)}
.zero{color:#567}

/* ---- the side panel: deck + level, then the game bar (score, Chips × Mult, goal/streak/best), quests, buttons */
.side{flex:0 0 232px;display:flex;flex-direction:column;gap:6px;padding:8px;overflow:auto}
.blind{border-radius:10px;overflow:hidden;background:var(--inner);flex:none}
.blind h2{margin:0;padding:6px;text-align:center;font-size:19px;background:var(--mult);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blind .bd{display:flex;gap:8px;align-items:center;padding:6px}
.blind .bd p{margin:0;font-size:12px;color:var(--dim);line-height:1.35}
.token{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:15px;text-align:center;line-height:1;
  background:var(--mult);box-shadow:inset 0 0 0 4px rgba(0,0,0,.25),inset 0 0 0 7px rgba(255,255,255,.18)}
.gbar{display:grid;gap:6px;grid-template-columns:1fr 1fr 1fr;font-variant-numeric:tabular-nums;cursor:pointer}
.gbar .score{grid-column:1/-1;display:flex;align-items:center;gap:8px}
.gbar .score b{font-size:22px;color:var(--gold)}
.xpbar{flex:1;min-width:30px;height:12px;border-radius:6px;background:rgba(0,0,0,.4);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--chips)}
.combo{grid-column:1/-1;text-align:center;padding:8px}
.combo .ht{font-size:17px;min-height:20px}
.combo.hot .ht{color:var(--gold)}
.cxm{display:flex;align-items:center;gap:4px;margin-top:6px}
.cxm b{flex:1;padding:6px 8px;border-radius:8px;font-size:24px}
.cxm .ch{background:var(--chips);text-align:right}.cxm .mu{background:var(--mult);text-align:left}
.cxm i{color:var(--mult);font-style:normal;font-size:20px}
.stat{text-align:center;padding:4px 2px}
.stat small{display:block}.stat b small{display:inline}
.stat b{display:block;font-size:20px;background:var(--inner);border-radius:8px;margin-top:2px;padding:2px 0}
.ring{display:inline-block;width:14px;height:14px;vertical-align:-1px;border-radius:50%;background:conic-gradient(var(--green) calc(var(--p) * 1%),#0006 0);-webkit-mask:radial-gradient(circle,transparent 45%,#000 48%);mask:radial-gradient(circle,transparent 45%,#000 48%)}
.ring.over{background:conic-gradient(var(--gold) calc(var(--p) * 1%),var(--green) 0)}
.questbox{font-size:13px;line-height:1.5;flex:none}
.quest.ok{color:var(--green)}
.sidebtns{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:none;margin-top:auto}
.sidebtns button{padding:8px 6px;font-size:14px}
/* juice: the Mult pops and wobbles on each hit (harder on a step up) and catches fire from combo 10 */
.combo .m{display:inline-block}
.combo .m.j{animation:juice .45s ease-out}
.combo .m.j.big{animation:juice-big .6s ease-out}
@keyframes juice{0%{transform:scale(1.35) rotate(-6deg)}30%{transform:scale(.92) rotate(4deg)}55%{transform:scale(1.06) rotate(-2deg)}80%{transform:scale(.99) rotate(1deg)}100%{transform:none}}
@keyframes juice-big{0%{transform:scale(1.8) rotate(-10deg)}25%{transform:scale(.85) rotate(7deg)}50%{transform:scale(1.12) rotate(-4deg)}75%{transform:scale(.97) rotate(2deg)}100%{transform:none}}
.fire{position:relative;isolation:isolate}
.fire::before{content:"";position:absolute;z-index:-1;left:-3px;right:-3px;bottom:-2px;height:calc(100% + 4px + 18px * var(--h));transform-origin:50% 100%;filter:blur(1.5px);border-radius:8px;
  background:radial-gradient(40% 45% at 50% 100%,#fff6a0,transparent),radial-gradient(45% 75% at 30% 100%,#ffb000,transparent),radial-gradient(60% 100% at 55% 100%,#ff4000 35%,transparent 72%);
  animation:flame .17s infinite alternate}
@keyframes flame{from{transform:scaleY(1) skewX(-5deg);opacity:.85}to{transform:scaleY(1.25) skewX(6deg);opacity:1}}
.shake{animation:shake calc(.2s + .08s * var(--s)) ease-out}
@keyframes shake{0%,100%{translate:0 0;rotate:0deg}20%{translate:calc(var(--s) * -2px) calc(var(--s) * 1px);rotate:calc(var(--s) * -.2deg)}40%{translate:calc(var(--s) * 2px) calc(var(--s) * -2px)}60%{translate:calc(var(--s) * -1px) calc(var(--s) * 1px);rotate:calc(var(--s) * .15deg)}80%{translate:calc(var(--s) * .5px) 0}}
.flash{position:fixed;inset:0;z-index:7;pointer-events:none;background:#fff;animation:flash .25s ease-out forwards}
@keyframes flash{from{opacity:.35}to{opacity:0}}
/* Points × Mult: a blue 10 and a red ×m slide in, slam into the total, which counts up and flies off. */
.pxm{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);z-index:8;pointer-events:none;display:flex;gap:6px;align-items:center;font-size:24px;white-space:nowrap}
.pxm .c,.pxm .x{padding:3px 10px;border-radius:8px}
.pxm .c{background:var(--chips);animation:inl .2s ease-out}
.pxm .x{background:var(--mult);animation:inr .2s ease-out}
@keyframes inl{from{transform:translateX(-60px);opacity:0}}
@keyframes inr{from{transform:translateX(60px);opacity:0}}
.pxm .t{display:inline-block;color:var(--gold);font-size:34px;animation:juice-big .5s ease-out}
.pxm.fly{transition:transform .35s ease-in,opacity .35s ease-in;transform:translate(-50%,-60vh) scale(.5);opacity:0}
.pop{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);z-index:8;pointer-events:none;font-size:22px;color:var(--gold);animation:pop .9s ease-out forwards}
.pop.brk{color:#fff;background:var(--mult);padding:4px 10px;border-radius:8px;font-size:24px;white-space:nowrap}
@keyframes pop{to{transform:translate(-50%,-50px);opacity:0}}

/* ---- the table */
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.logo{font-size:min(14vw,80px);line-height:.9;letter-spacing:2px;transform:rotate(-4deg);margin:1vh 0 2vh;text-align:center;flex:none;
  text-shadow:0 5px 0 #8a1020,0 9px 0 rgba(0,0,0,.4);animation:float 3s ease-in-out infinite alternate}
.logo span{color:var(--mult)}
@keyframes float{to{transform:rotate(-2deg) translateY(-6px)}}
.sunken{flex:1;min-height:0;overflow:auto;padding:6px}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--dim);text-align:left;padding:4px 10px}
td{padding:9px 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
td.name{white-space:normal}
th.n,td.n{text-align:right;width:3em}
tr.row td:first-child{border-radius:8px 0 0 8px}tr.row td:last-child{border-radius:0 8px 8px 0}
tr.row.sel td{background:rgba(255,255,255,.14)}
.decks{width:min(100%,560px);align-self:center;flex:0 1 auto}
.status{display:flex;gap:8px;flex:none;font-size:12px;color:var(--dim);justify-content:space-between}
.status span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deckline{flex:none;text-align:center}
.anki{flex:1;width:min(100%,680px);align-self:center;min-height:0;display:flex;border-radius:14px;background:rgba(14,24,26,.92);
  border:3px solid #cfd8d9;box-shadow:0 6px 0 rgba(0,0,0,.4)}
.anki iframe{flex:1;border:0;background:#0000;border-radius:12px;width:100%}
.timer{height:6px;flex:none;border-radius:3px;background:rgba(0,0,0,.35);overflow:hidden;width:min(100%,680px);align-self:center}
.timer i{display:block;height:100%;width:100%;background:var(--gold)}
.timer.wait i{background:#778}
.timer.low i{background:var(--mult)}
.prog{height:8px;flex:none;border-radius:4px;background:rgba(0,0,0,.35);display:flex;overflow:hidden;width:min(100%,680px);align-self:center}
.prog i{flex:none;width:calc(100% / 30);background:var(--green);box-shadow:inset -2px 0 rgba(0,0,0,.35)}
#sy{background:var(--green)}
.boss{flex:none;padding:6px 10px;text-align:center;border-radius:10px;background:linear-gradient(90deg,#8a1020,var(--mult),#8a1020);box-shadow:0 4px 0 rgba(0,0,0,.35);width:min(100%,680px);align-self:center}
.msg{display:grid;place-items:center;align-content:center;text-align:center;gap:12px;padding:20px 16px}
.msg .q{font-size:1.6em}
.msg p{margin:0;max-width:46ch;line-height:1.5;color:#dfe8e9;font-weight:700}
.report{width:auto;min-width:240px;max-width:340px;margin:0 auto}
.report td{padding:5px 12px;text-align:left}
.report tr:nth-child(odd) td{background:var(--inner)}
.report td:last-child{text-align:right;color:var(--gold)}
.chart{position:relative;height:120px;display:flex;align-items:flex-end;gap:2px;padding:0 2px;background:var(--inner);border-radius:8px}
.chart i{flex:1;min-height:1px;background:var(--chips);border-radius:2px 2px 0 0}
.chart i.hit{background:var(--green)}
.chart i.today{outline:2px solid #fff}
.chart b{position:absolute;left:0;right:0;border-top:2px dashed var(--mult)}
.chart-x{display:flex;justify-content:space-between;color:var(--dim);font-size:12px}
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;max-height:60vh;overflow:auto}
.tro{background:var(--inner);border-radius:10px;padding:6px;text-align:center;font-size:12px;line-height:1.3;font-weight:700}
.tro .i{font-size:1.8em}
.tro.off{opacity:.4;filter:grayscale(1)}
.opt{display:flex;gap:8px;align-items:center;font-weight:700}
.opt select{font:inherit;background:var(--inner);color:#fff;border:2px solid var(--edge);border-radius:8px;padding:4px}
.hint{margin:0;color:var(--dim);font-size:13px;line-height:1.4;font-weight:700}

/* ---- overlays: Balatro panels with a coloured header */
.veil{position:fixed;inset:0;display:grid;place-items:center;z-index:5;background:rgba(0,0,0,.45)}
.dlg{width:min(400px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;background:var(--panel);border:2px solid var(--edge);border-radius:12px;box-shadow:0 6px 0 rgba(0,0,0,.4)}
.dlg .titlebar{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;background:var(--mult);border-radius:10px 10px 0 0;font-size:19px}
.dlg .titlebar .t{flex:1}
.tb{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:rgba(0,0,0,.3);cursor:pointer}
.dlg .body{padding:12px;display:grid;gap:10px}
.dlg .body .row-btns span{font-weight:700}
.balloon{position:fixed;left:50%;transform:translateX(-50%);top:10px;width:min(320px,calc(100% - 24px));text-align:center;background:var(--panel);border:2px solid var(--gold);border-radius:12px;
  padding:8px 12px;box-shadow:0 5px 0 rgba(0,0,0,.4);z-index:9;font-size:14px;font-weight:700;animation:drop .25s ease-out}
.balloon b{display:block;margin-bottom:2px;font-size:18px;font-weight:900;color:var(--gold)}
@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}}
.startmenu{position:fixed;inset:0;z-index:7;display:grid;place-items:center;background:rgba(0,0,0,.45)}
.startmenu>div{width:min(320px,calc(100% - 24px));display:grid;gap:8px;padding:12px}
.startmenu header{text-align:center;font-size:22px}
.volpop{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:7;padding:12px 18px;display:grid;justify-items:center;gap:10px}
.volveil{position:fixed;inset:0;z-index:6;background:rgba(0,0,0,.45)}
.vtrack{position:relative;width:40px;height:160px;touch-action:none}
.vtrack::before{content:"";position:absolute;left:16px;top:0;bottom:0;width:8px;border-radius:4px;background:var(--inner)}
.vfill{position:absolute;left:16px;bottom:0;width:8px;border-radius:4px;background:var(--chips)}
.vthumb{position:absolute;left:4px;width:32px;height:16px;border-radius:6px;background:var(--orange);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.volpop label{display:flex;gap:6px;align-items:center}

/* scanlines + vignette (Settings: Retro screen) */
body.crt-on::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 1px,#0000 1px 3px),radial-gradient(ellipse at center,#0000 60%,rgba(0,0,0,.45))}

/* phones held upright: the side panel becomes a strip on top */
@media (orientation:portrait){
  #app{flex-direction:column;padding:6px;gap:6px}
  .side{flex:none;display:grid;grid-template-columns:1fr 1.5fr;gap:5px;padding:6px;overflow:visible}
  .side .questbox{display:none}
  .blind h2{font-size:15px;padding:3px}
  .blind .bd{padding:4px;gap:6px}
  .blind .bd p{font-size:11px}
  .token{width:34px;height:34px;font-size:12px}
  .gbar{grid-row:span 2;gap:4px}
  .gbar .score b{font-size:17px}
  .combo{padding:4px 6px}
  .combo .ht{font-size:13px;min-height:0}
  .cxm{margin-top:3px}
  .cxm b{font-size:18px;padding:2px 6px}
  .stat{padding:0}
  .stat b{font-size:15px}
  .sidebtns{margin:0}
  .sidebtns button{padding:6px 4px;font-size:13px}
  .logo{font-size:min(12vw,56px);margin:0 0 1vh}
}
@media (prefers-reduced-motion:reduce){.shake,.combo .m,.fire::before,.logo{animation:none}}
</style>
</head>
<body class="crt-on">
<canvas id="bg"></canvas>
<div id="app">
  <aside class="side panel">
    <div class="blind"><h2 id="wtitle">Joker XP</h2><div class="bd"><span class="token" id="lvtok"></span><p id="details"></p></div></div>
    <div id="gslot"></div>
    <div class="box questbox"><small>Daily quests</small><div id="questsPane"></div></div>
    <div class="sidebtns"><button class="b-red" id="tQuests">Quests</button><button class="b-orange" id="start">Menu</button>
      <button class="b-grey" id="music" title="Music: tap to play or pause, hold for volume">🔇</button><button class="b-green" id="traySync">Sync</button></div>
  </aside>
  <section class="main" id="content"></section>
</div>
<div id="layer"></div>

<script src="../shared.js"></script>
<script>
// ---------------------------------------------------------------- data: kuma3 through the app's bridge, or examples in a browser
const mock = (() => {
  const decks = [
    {id:"1",name:"🐻 German",new:5,learn:2,due:31,cards:[
      ["Ich hab keine Ahnung.","I have no idea.<br><i>Ahnung = idea, clue</i>"],
      ["Kannst du mir kurz helfen?","Can you help me for a second?<br><i>kurz = briefly</i>"],
      ['<div id="raw-word" style="display:none">Fall[der, die Fälle]</div>Ja, auf jeden Fall.',"Yes, definitely.",7]]},
    {id:"2",name:"🐻 English",new:3,learn:0,due:12,cards:[["thought","/θɔːt/ · I thought you were asleep."]]},
    {id:"3",name:"🐻 Japanese",new:5,learn:1,due:8,cards:[["食べる","たべる · to eat"]]}];
  let n = 0;
  return {
    status: () => ({pkg:"example", anki:true, media:true, mediaBase:""}),
    decks: () => decks.map(({cards, ...d}) => d),
    next(id) {
      const d = decks.find(x => x.id === id);
      if (!d || !(d.new + d.learn + d.due)) return null;
      const [q, a, lapses = 0] = d.cards[n++ % d.cards.length];
      return {nid:String(n), ord:0, css:".card{font:24px sans-serif;text-align:center;margin-top:24px}",
        q, a: q + "<hr>" + a, times:["<10m","1d","3d","8d"], model:"🐻 German", lapses, flag:0};
    },
    bury() { mock.answer(null, 3); }, improved() {}, progressRead: () => ({}), progressWrite() {}, vibrate() {}, boss: () => null, openKumapie() { balloon("kumapie", "In the app this opens kumapie."); },
    answer(card, ease) {
      const d = decks.find(x => x.id === sel), k = d.new ? "new" : d.learn ? "learn" : "due";
      d[k]--; if (ease === 1) d.learn++;
    },
    sync() { balloon("kuma3 sync", "In the app this asks kuma3 to sync with AnkiWeb."); },
    open() {}, grantAnki() {}, grantMedia() {}
  };
})();
const api = B ? {
  status: () => JSON.parse(B.status()),
  decks: () => JSON.parse(B.decks()),
  next: id => JSON.parse(B.next(id)),
  answer: (c, ease, ms) => B.answer(c.nid, c.ord, ease, ms),
  bury: c => B.bury(c.nid, c.ord), openKumapie: c => B.openKumapie(c.nid), vibrate: p => B.vibrate(p), boss: id => JSON.parse(B.boss(id)),
  progressRead: () => JSON.parse(B.progressRead()), progressWrite: (d, t) => B.progressWrite(d, t), improved: c => B.improved(c.nid, c.ord, c.tags),
  sync: () => B.sync(), open: () => B.openAnki(),
  grantAnki: () => B.grantAnki(), grantMedia: () => B.grantMedia()
} : mock;

// ---------------------------------------------------------------- state
let st = {}, decks = [], sel = null, view = "decks", card = null, shown = false, shownAt = 0, done = 0;
try { sel = localStorage.getItem("deck"); } catch (e) {}
const $ = id => document.getElementById(id), C = $("content");
const esc = s => String(s).replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const deck = () => decks.find(d => d.id === sel);
// Failed LEECH+ times since the last improvement: improve it first (kumapie and /improve-card flag improved cards
// orange = 2). Anki's own lapse count can't be changed here, so improving saves it as the note tag xp::lapses::N
// (failures count from there, on every device) and clears the flag, so the next improvement shows again.
const LEECH = 6;
const BASE = /(?:^|\s)xp::lapses::(\d+)(?=\s|$)/;
const fails = c => (c.lapses ?? 0) - +(BASE.exec(c.tags || "")?.[1] ?? 0);
const leech = c => c?.model === "🐻 German" && fails(c) >= LEECH;
const blocked = c => leech(c) && c.flag !== 2;
function checkImproved(c) {
  if (!leech(c) || c.flag !== 2) return;
  c.tags = `${(c.tags || "").replace(BASE, " ").trim()} xp::lapses::${c.lapses}`.trim(); c.flag = 0;
  api.improved(c);
  balloon("Card improved", "Its failures start again from 0.");
}
const left = d => d ? d.new + d.learn + d.due : 0;

function refresh() {
  try {
    st = api.status();
    if (!st.pkg || !st.anki || !st.media) { view = "setup"; return render(); }
    if (view === "setup") view = "decks";
    decks = api.decks().filter(d => !(d.name === "Default" && !left(d)));
    if (!deck()) sel = decks[0]?.id ?? null;
    syncGame();
    paused = false;
    if (view === "review") nextCard(); else render();
    playMusic();
  } catch (e) { failed(); }
}
function failed() {   // kuma3 didn't answer: an error panel with a way out
  $("wtitle").textContent = "Error";
  C.innerHTML = `<div class="sunken msg"><div class="q">⚠ kuma3 isn't answering</div>
    <p>Joker XP couldn't reach your kuma3 collection. Open kuma3 once, then try again.</p>
    <div class="row-btns"><button class="btn" id="again">Try again</button><button class="btn" id="op">Open kuma3</button></div></div>`;
  $("again").onclick = refresh; $("op").onclick = () => api.open();
}

// ---------------------------------------------------------------- views
function render() {
  newDay();
  $("details").innerHTML = `${g.xp} XP<br>Best combo today: ${g.best}<br>Best ever: ${g.record}`;
  $("lvtok").innerHTML = `Lv<br>${level(g.xp) + 1}`;
  $("questsPane").innerHTML = questList();
  $("gslot").innerHTML = gameBar(); $("gbar").onclick = questsBox;

function cardDoc(html, skip, head = "") {
  let first = true;
  html = html.replace(/\[sound:([^\]]+)\]/g, (m, f) => {
    const auto = first && !skip.includes(f); if (auto) first = false;
    const src = esc(encodeURI(f));
    return /\.(mp4|webm|mkv|mov|m4v)$/i.test(f)
      ? `<video src="${src}" controls playsinline ${auto ? "autoplay" : ""}></video>`
      : `<audio src="${src}" controls ${auto ? "autoplay" : ""}></audio>`;
  });
  return `<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><base href="${esc(st.mediaBase)}"><script>(${cardHelper})()<\/script>
${head}<style>${card.css || ""}</style><style>html,body,.card{background:transparent!important;color:#f4f0e6!important}html{color-scheme:dark}
body{margin:0;padding:56px 14px 14px}img,video{max-width:100%;height:auto}</style></head>
<body class="card card${card.ord + 1} nightMode night_mode">${html}</body></html>`;
}
const sounds = html => [...(html || "").matchAll(/\[sound:([^\]]+)\]/g)].map(m => m[1]);

// Type-the-answer cards ({{type:Field}}): kuma3 sends rslib's [[type:Field]]. The question gets a box (Enter = show
// the answer), the answer what was typed against the field: green when right, else struck out red + the right one.
const TYPE = /\[\[type:(?:[^\]]*:)?([^\]:]+)\]\]/g;
let typed = "";
const typeQ = html => html.replace(TYPE, `<input id="typeans" value="${esc(typed)}" autocomplete="off" autocapitalize="off" spellcheck="false"
  style="font:inherit;font-size:.7em;width:80%;max-width:20em;flex-basis:auto;text-align:center;color:#000;background:#fff">`);
function typeA(html) {
  let n = 0;
  return html.replace(TYPE, (m, f) => {
    if (n++) return "";
    const want = new DOMParser().parseFromString(card.fields?.[f] ?? "", "text/html").body.textContent.trim();
    const got = typed.trim(), same = got.normalize("NFKC") === want.normalize("NFKC");
    return same ? `<div style="color:#3c3">${esc(want)} ✓</div>`
      : `<div><s style="color:#e33">${esc(got || "–")}</s><br><span style="color:#3c3">${esc(want)}</span></div>`;
  });
}

// The deck's done: a report window for this session (since Study was pressed).

  }

  const rows = [
    ["Reps", sess.reps],

    ["Best combo", sess.best + (sess.best && sess.best >= g.record ? " (record!)" : "")],

    ["Average answer", sess.thinkN ? `${(sess.think / sess.thinkN / 1000).toFixed(1)} s` : "-"],

}

function rate(ease) {

// ---------------------------------------------------------------- controller (8BitDo Micro held upright, the AnKing layout,
// same as Anki Hunger): MainActivity sends pad(key) with the controller's own button names.
// Review: X Again, A Hard, Y Good, B Easy (on the question any of them shows the answer); D-pad right/left = scroll
// the card up/down, up/down do nothing; L1 = word audio, then sentence audio, then the clip; R1 = back to the decks.
// Decks: D-pad picks the deck (right/up = up, left/down = down), A or B = study it (or the next deck with cards),
// X = the previous deck with cards, Y = study the highlighted deck. An open window: any face button closes it.
const FACE = {x: 1, a: 2, y: 3, b: 4};
function pad(k) {
  if ($("layer").innerHTML) { if (FACE[k]) closeStart(); return; }
  if (view === "decks") {
    const n = decks.length, i = decks.findIndex(d => d.id === sel), step = {up: -1, right: -1, down: 1, left: 1}[k];
    const pick = id => { sel = id; try { localStorage.setItem("deck", sel); } catch (e) {} };
    const due = dir => { for (let j = 1; j <= n; j++) { const d = decks[(i + dir * j + n * j) % n]; if (left(d)) return d.id; } };
    if (step) { pick(decks[(i + step + n) % n]?.id ?? sel); render(); C.querySelector("tr.sel")?.scrollIntoView({block: "nearest"}); }
    else if (k === "a" || k === "b") { if (!left(deck()) && due(1)) pick(due(1)); study(); }
    else if (k === "x" && due(-1)) { pick(due(-1)); study(); }
    else if (k === "y") study();
    return;
  }
  if (view !== "review") return;
  if (k === "r1") return leaveDeck();
  if (!card) { if (FACE[k]) leaveDeck(); return; }
  if (blocked(card)) return;   // "Improve this card first": its buttons are for touch
  if (FACE[k]) return shown ? rate(FACE[k]) : reveal();
  if (k === "right" || k === "left") return toCard({t: "scroll", dy: k === "right" ? -240 : 240});
  if (k === "l1") return toCard({t: "replay"});
}

// ---------------------------------------------------------------- the swirling background (WebGL, drawn small and pixelated)
const bg = (() => {
  const cv = document.getElementById("bg"), gl = cv.getContext("webgl");
  let want = [[.08, .32, .2], [.13, .45, .3]], cur = want.map(c => [...c]);
  if (!gl) return {set: () => {}};
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, "attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}"));
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, `precision mediump float;uniform vec2 res;uniform float t;uniform vec3 a,b;
    void main(){vec2 uv=(gl_FragCoord.xy-.5*res)/res.y;float r=length(uv);float an=atan(uv.y,uv.x)+t*.05-r*2.5;
      vec2 p=vec2(cos(an),sin(an))*r*5.;
      for(int i=0;i<5;i++){p+=vec2(sin(p.y*1.2+t*.25),cos(p.x*1.1-t*.2))*.6;}
      float v=sin(p.x+p.y)*.5+.5;vec3 c=mix(a,b,smoothstep(.3,.55,v));c=mix(c,b*1.35,smoothstep(.82,.95,v));
      gl_FragColor=vec4(c,1);}`));
  gl.linkProgram(pr); gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, "p"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const U = n => gl.getUniformLocation(pr, n), t0 = performance.now();
  let last = 0;
  (function frame(now) {
    requestAnimationFrame(frame);
    if (document.hidden || now - last < 50) return;   // ~20 fps is plenty for a slow swirl
    last = now;
    const w = Math.ceil(innerWidth / 5), h = Math.ceil(innerHeight / 5);
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; gl.viewport(0, 0, w, h); }
    cur = cur.map((c, i) => c.map((v, j) => v + (want[i][j] - v) * .06));
    gl.uniform2f(U("res"), w, h); gl.uniform1f(U("t"), (now - t0) / 1000);
    gl.uniform3fv(U("a"), cur[0]); gl.uniform3fv(U("b"), cur[1]);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  })(0);
  const rgb = hex => [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255);
  return {set(hex) { const c = rgb(hex); want = [c.map(v => v * .45), c.map(v => v * .8)]; }};
})();

// ---------------------------------------------------------------- game: XP, combo, daily goal, daily quests
// Hard/Good/Easy pay the same (10 XP × multiplier), Again 2 XP: the button can't buy XP beyond that.
// The combo grows on Hard/Good/Easy answered within FAST ms of the word audio ending; Again, the clock
// running out, or leaving the deck breaks it.
// Synced through kuma3 (bridge progressRead/progressWrite): each device keeps only its own part, `mine`
// = {xp, record, goal: [reps, set at ms], days: {day: {reps, fast, best, xp, got, goal}}}, in its progress
// note; `g` is everyone's parts merged (XP and daily counts added up, best/record the highest, the latest
// goal), so the phone and the tablet share XP, quests and the streak.
const QUEST_XP = 100, MILESTONES = [10, 25, 50, 100];
let FAST = prefs.limit * 1000;   // the combo time limit (Settings)
let mine = {xp: 0, record: 0, goal: [100, 0], days: {}}, others = {}, g,
    combo = 0, juice = "", thinkMs = 1e9, recordShown = false, sess = null;
let device = ""; try { device = localStorage.getItem("jokerxp-device") || ""; } catch (e) {}
if (!device) {
  device = `${B ? B.model() : "browser"}-jokerxp-${Math.random().toString(36).slice(2, 8)}`;
  try { localStorage.setItem("jokerxp-device", device); } catch (e) {}
}
function dayKey(back = 0) {   // Anki's day starts at 4 am
  const t = new Date(Date.now() - 4 * 3600e3 - back * 86400e3);
  return `${t.getFullYear()}-${t.getMonth() + 1}-${t.getDate()}`;
}
try { const saved = localStorage.getItem("jokerxp-mine"); if (saved) mine = JSON.parse(saved); } catch (e) {}
function merge() {
  const parts = [mine, ...Object.values(others)], days = {};
  for (const p of parts) for (const [k, v] of Object.entries(p.days || {})) {
    const d = days[k] ??= {reps: 0, fast: 0, best: 0, xp: 0, got: [], goal: 0};
    d.reps += v.reps | 0; d.fast += v.fast | 0; d.xp += v.xp | 0;
    d.best = Math.max(d.best, v.best | 0); d.goal = Math.max(d.goal, v.goal | 0);
    for (const q of v.got || []) if (!d.got.includes(q)) d.got.push(q);
  }
  const goal = parts.map(p => p.goal || [100, 0]).reduce((x, y) => y[1] > x[1] ? y : x)[0];
  const day = dayKey(), t = days[day] || {reps: 0, fast: 0, best: 0, got: []};
  const hit = k => !!days[k] && days[k].reps >= (days[k].goal || goal);   // that day's goal reached
  const studied = k => (days[k]?.reps || 0) > 0;
  let streak = 0;   // days in a row with a review here (user), up to today (or yesterday: today still has time); no freezes
  for (let i = studied(day) ? 0 : 1; studied(dayKey(i)); i++) streak++;
  const ach = {};   // achievement id -> when it was first unlocked on any device
  for (const p of parts) for (const [k, v] of Object.entries(p.ach || {})) ach[k] = Math.min(ach[k] ?? Infinity, v);
  return {ach, bosses: parts.reduce((n, p) => n + (p.bosses | 0), 0), xp: parts.reduce((n, p) => n + (p.xp | 0), 0), record: Math.max(...parts.map(p => p.record | 0)), goal, day,
    reps: t.reps, fast: t.fast, best: t.best, got: t.got, goalHit: hit(day), streak, days, hit, studied};
}
g = merge();
const today = () => mine.days[dayKey()] ??= {reps: 0, fast: 0, best: 0, xp: 0, got: [], goal: g.goal};
function saveGame() {
  g = merge();
  const text = JSON.stringify(mine);
  try { localStorage.setItem("jokerxp-mine", text); } catch (e) {}
  try { api.progressWrite(device, text); } catch (e) {}   // kuma3 not answering: the next save writes it
}
function syncGame() {   // the other devices' parts (at start and when coming back to the app)
  try { const all = api.progressRead(); delete all[device]; others = all; } catch (e) {}
  saveGame();
}
function newDay() { if (g.day !== dayKey()) { g = merge(); combo = 0; } }
const streak = () => g.streak;
const level = xp => Math.floor((Math.sqrt(1 + 0.08 * xp) - 1) / 2);   // level L starts at 50·L·(L+1) XP
const mult = () => Math.min(5, 1 + Math.floor(combo / 5)) * (g.reps >= g.goal ? 1.5 : 1);
function quests() {   // three a day; sizes change with the date
  const h = [...g.day].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
  return [
    {id: "reps", text: `Do ${Math.round(g.goal * [1.2, 1.5, 2][h % 3])} reps`, need: Math.round(g.goal * [1.2, 1.5, 2][h % 3]), have: g.reps},
    {id: "combo", text: `Reach a ${[15, 20, 25, 30][h % 4]}-rep combo`, need: [15, 20, 25, 30][h % 4], have: g.best},
    {id: "fast", text: `${Math.round(g.goal * [.4, .5, .6][(h >> 3) % 3])} answers in under ${FAST / 1000} s`, need: Math.round(g.goal * [.4, .5, .6][(h >> 3) % 3]), have: g.fast}];
}
function score(ease) {
  newDay();
  const fast = thinkMs < FAST, lv = level(g.xp), m0 = mult(), wasHit = g.goalHit, record = g.record, firstToday = !g.reps;
  if (ease === 1) breakCombo(); else if (!fast) breakCombo(); else combo++;
  blip(ease); buzz(ease);
  juice = !combo ? "" : mult() > m0 ? " j big" : " j";
  const boss = isBoss(card);
  const xp = ease === 1 ? 2 : Math.round(10 * mult()) * (boss ? 3 : 1);
  const t = today();
  t.reps++; t.fast += fast && ease > 1; t.best = Math.max(t.best, combo); t.xp += xp; t.goal = g.goal;
  mine.xp += xp; mine.record = Math.max(mine.record, combo);
  g = merge();
  if (ease === 1) pop(`+${xp} XP`); else pointsMult(mult() * (boss ? 3 : 1), xp);
  if (sess) {
    sess.reps++; sess.again += ease === 1; sess.best = Math.max(sess.best, combo);
    if (thinkMs < 60000) { sess.think += thinkMs; sess.thinkN++; }
  }
  if (boss && ease > 1) {
    bosses[sel].beaten = true; saveBosses(); mine.bosses = (mine.bosses | 0) + 1;
    win("👑 Boss defeated!", `Triple XP: +${xp}.`, [392, 523, 659, 784, 1047, 1319], "square"); buzz("milestone");
  } else if (boss) balloon("👑 The boss won this round", "It comes back later today: beat it then for ×3 XP.");
  if (mult() > m0 && combo) { chime([660, 880]); shake(Math.floor(mult())); }
  if (MILESTONES.includes(combo)) { win(`${combo} combo!`, `${combo} in a row. Keep going!`, [523, 659, 784, 1047, 1319], "square"); buzz("milestone"); }
  if (combo > record && !recordShown && record >= 5) { win("New record!", `Best combo ever: ${combo} and counting.`, [784, 1047, 1568], "square"); recordShown = true; }
  if (firstToday) win(`🔥 ${g.streak}-day streak`, g.streak > 1 ? "Another day in a row. Keep it going!" : "Day 1. Come back tomorrow!", [523, 784, 1047], "square");
  if (g.goalHit && !wasHit) win("Daily goal done!", "Overtime: every rep now gives 1.5× XP.", [523, 659, 784, 1047]);
  for (const q of quests()) if (q.have >= q.need && !g.got.includes(q.id)) {
    t.got.push(q.id); t.xp += QUEST_XP; mine.xp += QUEST_XP; g = merge();
    win("Quest complete!", `${q.text} · +${QUEST_XP} XP`, [784, 988, 1175]);
  }
  if (level(g.xp) > lv) win(`Level ${level(g.xp) + 1}!`, "Keep the combo going.", [523, 784, 1047, 1568]);
  checkAch();
  saveGame();
}
function gameBar() {   // the side panel's score box: level + XP bar, Chips × Mult (the combo), goal / streak / best
  newDay();
  const L = level(g.xp), lo = 50 * L * (L + 1), over = g.reps >= g.goal, j = juice;
  juice = "";   // one bounce per hit: later redraws (reveal, clock) don't replay it
  const p = over ? Math.min(100, 100 * (g.reps - g.goal) / g.goal) : 100 * g.reps / g.goal;
  const fire = combo >= 10 ? ` fire" style="--h:${Math.min(1, (combo - 10) / 40)}` : "";
  return `<div class="gbar" id="gbar" title="Tap for today's quests">
    <div class="box score"><b>Lv ${L + 1}</b><span class="xpbar"><i style="width:${100 * (g.xp - lo) / (100 * (L + 1))}%"></i></span></div>
    <div class="box combo${combo >= 5 ? " hot" : ""}"><div class="ht">${combo ? `Combo ${combo}` : "No combo"}</div>
      <div class="cxm"><b class="ch">10</b><i>X</i><b class="mu${fire}"><span class="m${j}">${+mult().toFixed(1)}</span></b></div></div>
    <div class="stat"><small><span class="ring${over ? " over" : ""}" style="--p:${p}"></span> Goal</small><b>${g.reps}<small>/${g.goal}</small></b></div>
    <div class="stat"><small>Streak</small><b>🔥${streak()}</b></div>
    <div class="stat"><small>Best</small><b>${g.best}</b></div></div>`;
}
const questList = () => quests().map(q => `<span class="quest${g.got.includes(q.id) ? " ok" : ""}">${g.got.includes(q.id) ? "✔" : "☐"} ${esc(q.text)} (${Math.min(q.have, q.need)}/${q.need})</span>`).join("<br>");
function questsBox() {
  newDay();
  $("layer").innerHTML = `<div class="veil" id="qveil"><div class="dlg"><div class="titlebar"><span class="t">Daily Quests</span><span class="tb x" id="qx">✕</span></div>
    <div class="body"><div>${questList()}</div><div>Each quest: +${QUEST_XP} XP · ${g.xp} XP total · best combo today ${g.best} · best ever ${g.record}</div>
    <div class="row-btns"><button class="btn" id="gm">−10</button><span style="align-self:center">Daily goal: <b id="gv">${g.goal}</b> reps</span><button class="btn" id="gp">+10</button></div>
    <div class="row-btns"><button class="btn" id="gs">Statistics</button></div></div></div></div>`;
  const goal = d => { mine.goal = [Math.max(10, g.goal + d), Date.now()]; today().goal = mine.goal[0]; saveGame(); $("gv").textContent = g.goal; render(); };
  $("gm").onclick = () => goal(-10); $("gp").onclick = () => goal(10); $("gs").onclick = statsBox;
  $("qx").onclick = closeStart; $("qveil").onclick = e => e.target.id === "qveil" && closeStart();
}
function breakCombo() {
  if (combo >= 3) {
    pop(`COMBO BROKEN ×${combo}`, "brk");
    slide(440, 110, 0.4); buzz("break");
  }
  combo = 0; recordShown = false;
}
// Boss card: per deck per day, its due card with the most lapses (kuma3's cards query); ×3 XP when answered
// right. Chosen once a day on this device (each device may pick its own).
let bosses = {}; try { bosses = JSON.parse(localStorage.getItem("jokerxp-boss") || "{}"); } catch (e) {}
const saveBosses = () => { try { localStorage.setItem("jokerxp-boss", JSON.stringify(bosses)); } catch (e) {} };
function pickBoss() {
  if (bosses[sel]?.day === dayKey()) return;
  let c = null; try { c = api.boss(sel); } catch (e) {}
  bosses[sel] = c ? {day: dayKey(), nid: c.nid, ord: c.ord, beaten: false} : {day: dayKey(), none: true};
  saveBosses();
}
function isBoss(c) {
  const b = bosses[sel];
  return !!c && !!b && b.day === dayKey() && !b.none && !b.beaten && b.nid === c.nid && b.ord === c.ord;
}

// Achievements (synced: mine.ach = {id: unlocked at ms}, merged into g.ach).
const totalReps = () => Object.values(g.days).reduce((n, d) => n + d.reps, 0);
const ACH = [
  {id: "goal", icon: "🎯", name: "Goal getter", desc: "Reach the daily goal", ok: () => g.goalHit},
  {id: "overtime", icon: "⏱️", name: "Overtime", desc: "Double the daily goal in a day", ok: () => g.reps >= 2 * g.goal},
  {id: "speed", icon: "🏎️", name: "Speedy", desc: "50 fast answers in a day", ok: () => g.fast >= 50},
  {id: "combo10", icon: "⚡", name: "On a roll", desc: "A 10-rep combo", ok: () => g.record >= 10},
  {id: "combo25", icon: "⚡", name: "Unstoppable", desc: "A 25-rep combo", ok: () => g.record >= 25},
  {id: "combo50", icon: "🌩️", name: "Lightning", desc: "A 50-rep combo", ok: () => g.record >= 50},
  {id: "combo100", icon: "💯", name: "Hundred in a row", desc: "A 100-rep combo", ok: () => g.record >= 100},
  {id: "streak7", icon: "🔥", name: "One week", desc: "A 7-day streak", ok: () => g.streak >= 7},
  {id: "streak30", icon: "🔥", name: "One month", desc: "A 30-day streak", ok: () => g.streak >= 30},
  {id: "streak100", icon: "🔥", name: "Hundred days", desc: "A 100-day streak", ok: () => g.streak >= 100},
  {id: "reps1000", icon: "📚", name: "Thousand", desc: "1,000 reps here", ok: () => totalReps() >= 1000},
  {id: "reps10000", icon: "🏛️", name: "Ten thousand", desc: "10,000 reps here", ok: () => totalReps() >= 10000},
  {id: "level10", icon: "⭐", name: "Level 10", desc: "Reach level 10", ok: () => level(g.xp) + 1 >= 10},
  {id: "level25", icon: "🌟", name: "Level 25", desc: "Reach level 25", ok: () => level(g.xp) + 1 >= 25},
  {id: "perfect", icon: "💎", name: "Flawless", desc: "Finish a deck (20+ reps) without Again", ok: () => false},
  {id: "boss", icon: "👑", name: "Boss slayer", desc: "Beat a boss card", ok: () => g.bosses >= 1},
  {id: "boss10", icon: "👑", name: "Boss hunter", desc: "Beat 10 boss cards", ok: () => g.bosses >= 10},
];
function checkAch(extra = []) {
  for (const a of ACH) if (!g.ach[a.id] && (extra.includes(a.id) || a.ok())) {
    (mine.ach ??= {})[a.id] = Date.now(); g = merge();
    win(`🏆 ${a.icon} ${a.name}`, a.desc, [659, 784, 988, 1319, 1568], "square"); buzz("milestone");
  }
}
function trophiesBox() {
  const n = ACH.filter(a => g.ach[a.id]).length;
  $("layer").innerHTML = `<div class="veil" id="tveil"><div class="dlg"><div class="titlebar"><span class="t">Trophies · ${n} of ${ACH.length}</span><span class="tb x" id="tx">✕</span></div>
    <div class="body"><div class="trophies">${ACH.map(a => {
      const at = g.ach[a.id];
      return `<div class="tro${at ? "" : " off"}"><div class="i">${a.icon}</div><b>${esc(a.name)}</b><br>${esc(a.desc)}${at ? `<br><small>${new Date(at).toLocaleDateString()}</small>` : ""}</div>`;
    }).join("")}</div></div></div></div>`;
  $("tx").onclick = closeStart; $("tveil").onclick = e => e.target.id === "tveil" && closeStart();
}

// Statistics: the last 30 days of reps (green = goal done) and the totals, from everyone's merged parts.
function statsBox() {
  newDay();
  const N = 30, days = [...Array(N)].map((_, i) => dayKey(N - 1 - i));
  const top = Math.max(g.goal, ...days.map(k => g.days[k]?.reps || 0), 1);
  const bars = days.map((k, i) => {
    const r = g.days[k]?.reps || 0;
    return `<i class="${g.hit(k) ? "hit" : ""}${i === N - 1 ? " today" : ""}" style="height:${100 * r / top}%" title="${k}: ${r} reps"></i>`;
  }).join("");
  let longest = 0, run = 0;
  for (let i = 400; i >= 0; i--) { run = g.studied(dayKey(i)) ? run + 1 : 0; longest = Math.max(longest, run); }
  const all = Object.values(g.days), L = level(g.xp);
  const rows = [
    ["Today", `${g.reps}/${g.goal} reps`], ["Streak", g.streak ? `🔥 ${g.streak} day${g.streak > 1 ? "s" : ""}` : "0"],
    ["Longest streak", `${longest} day${longest === 1 ? "" : "s"}`], ["Best combo ever", g.record],
    ["Level", `${L + 1} (${g.xp} XP)`], ["Total reps", all.reduce((n, d) => n + d.reps, 0)],
    ["Days studied", all.filter(d => d.reps).length], ["Devices", 1 + Object.keys(others).length]];
  $("layer").innerHTML = `<div class="veil" id="sveil"><div class="dlg"><div class="titlebar"><span class="t">Statistics</span><span class="tb x" id="sx">✕</span></div>
    <div class="body"><div class="chart"><b style="bottom:${100 * g.goal / top}%"></b>${bars}</div><div class="chart-x"><span>30 days ago</span><span>today</span></div>
    <table class="report">${rows.map(([k, v]) => `<tr><td>${k}</td><td>${esc(String(v))}</td></tr>`).join("")}</table></div></div></div>`;
  $("sx").onclick = closeStart; $("sveil").onclick = e => e.target.id === "sveil" && closeStart();
}
function pop(text, cls = "") {
  const p = document.createElement("div"); p.className = "pop " + cls; p.textContent = text;
  document.body.append(p); setTimeout(() => p.remove(), 900);
}
function pointsMult(m, xp) {
  const p = document.createElement("div"); p.className = "pxm";
  p.innerHTML = `<span class="c">10</span><span class="x">×${+m.toFixed(1)}</span>`;
  document.body.append(p);
  setTimeout(() => {
    p.innerHTML = `<span class="t">+0 XP</span>`;
    const t = p.firstChild, t0 = performance.now();
    const tick = now => { const k = Math.min(1, (now - t0) / 300); t.textContent = `+${Math.round(xp * (1 - (1 - k) ** 3))} XP`; if (k < 1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  }, 380);
  setTimeout(() => p.classList.add("fly"), 950);
  setTimeout(() => p.remove(), 1350);
}
function shake(s) {   // table shake + flash, stronger at each multiplier step (s = 1..5)
  const w = $("app"); w.classList.remove("shake"); void w.offsetWidth;
  w.style.setProperty("--s", s); w.classList.add("shake");
  w.onanimationend = e => e.animationName === "shake" && w.classList.remove("shake");
  const f = document.createElement("div"); f.className = "flash"; document.body.append(f); setTimeout(() => f.remove(), 250);
}
function win(title, msg, notes, type) { balloon(title, msg); chime(notes, type); }

// ---------------------------------------------------------------- the combo clock
// Starts when the front's word audio ends (the card plays it through its own Web Audio player, hooked
// in wordHook), right away on a card without word audio, or after 5 s if the word audio never reports
// back. Counts only while the app is in front: deltas over 250 ms (app in the background, throttled)
// don't count.
let clock = {tok: 0, on: false, ms: 0, broke: false, last: 0}, paused = false;
const wordFile = q => /data-audio="word"[\s\S]*?\[audio:\s*([^\]]+?)\s*\]/.exec(q || "")?.[1];
function resetTimer() {
  clock = {tok: clock.tok + 1, on: false, ms: 0, broke: false, last: performance.now()};
  const tok = clock.tok;
  if (!wordFile(card?.q)) clock.on = true;
  else setTimeout(() => wordDone(tok), 5000);
}
function wordDone(tok) { if (tok === clock.tok && !clock.on) { clock.on = true; clock.last = performance.now(); drawTimer(); } }
function wordHook() {   // a script for the front's <head>: tells this page when the word audio has played
  const w = wordFile(card?.q);
  if (!w) return "";
  return `<script>(function(){var W=${JSON.stringify(w)},T=${clock.tok},f;
function done(){parent.postMessage({t:"word",tok:T},"*")}
Object.defineProperty(window,'__playMobile',{configurable:true,get:function(){return f},set:function(g){f=function(src){
var r=g.apply(this,arguments),s=String(src);try{s=decodeURIComponent(s)}catch(e){}
if(s.indexOf(W)>=0&&r&&r.then)r.then(done,done);return r}}})})();<\/script>`;
}
function drawTimer() {
  const t = $("timer"); if (!t) return;
  const left = Math.max(0, FAST - clock.ms);
  t.className = "timer" + (!clock.on ? " wait" : left <= 3000 ? " low" : "");
  t.firstChild.style.width = (clock.on ? 100 * left / FAST : 100) + "%";
}
setInterval(() => {
  const now = performance.now(), dt = now - clock.last; clock.last = now;
  if (view !== "review" || !card || shown || paused || !clock.on || blocked(card) || dt > 250) return;
  const before = clock.ms; clock.ms += dt;
  const left = FAST - clock.ms;
  if (left > 0 && left <= 3000 && Math.ceil(left / 1000) < Math.ceil((FAST - before) / 1000) && combo >= 3) chime([1200], "sine", 0.2);
  if (left <= 0 && !clock.broke) {   // only the game bar changes: redrawing the card would restart its audio
    clock.broke = true; breakCombo();
    const gb = $("gbar"); if (gb) { gb.outerHTML = gameBar(); $("gbar").onclick = questsBox; }
  }
  drawTimer();
}, 100);

// ---------------------------------------------------------------- sounds (Web Audio, no files)
let ac;
function chime(notes, type = "triangle", vol = 0.35) {   // short arpeggio
  if (!prefs.sound) return;
  try {
    ac ??= new AudioContext();
    notes.forEach((f, i) => {
      const o = ac.createOscillator(), v = ac.createGain(), t = ac.currentTime + i * 0.09;
      o.type = type; o.frequency.value = f;
      v.gain.setValueAtTime(vol, t); v.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      o.connect(v).connect(ac.destination); o.start(t); o.stop(t + 0.3);
    });
  } catch (e) {}
}
function slide(from, to, secs) {   // the combo-break "fall"
  if (!prefs.sound) return;
  try {
    ac ??= new AudioContext();
    const o = ac.createOscillator(), v = ac.createGain(), t = ac.currentTime;
    o.type = "sawtooth"; o.frequency.setValueAtTime(from, t); o.frequency.exponentialRampToValueAtTime(to, t + secs);
    v.gain.setValueAtTime(0.35, t); v.gain.exponentialRampToValueAtTime(0.001, t + secs);
    o.connect(v).connect(ac.destination); o.start(t); o.stop(t + secs);
  } catch (e) {}
}
// 8-bit blips per button: Again a low bonk, Hard one note, Good two up, Easy a quick run.
const BLIPS = {1: [196, 131], 2: [440], 3: [523, 784], 4: [659, 880, 1319]};
// Vibration patterns (on, off, on… ms): a tap for each button, heavier for Again; a double knock for a break.
const BUZZ = {1: "45", 2: "15", 3: "12", 4: "10,40,10", break: "70,60,110", milestone: "25,40,25,40,60"};
function buzz(kind) { if (prefs.vibrate) try { api.vibrate(BUZZ[kind]); } catch (e) {} }
function blip(ease) {
  if (!prefs.sound) return;
  try {
    ac ??= new AudioContext();
    BLIPS[ease].forEach((f, i) => {
      const o = ac.createOscillator(), v = ac.createGain(), t = ac.currentTime + i * 0.05;
      o.type = "square"; o.frequency.value = f * 2 ** (Math.min(combo, 12) / 12);   // a semitone up per combo hit, an octave max
      v.gain.setValueAtTime(0.3, t); v.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
      o.connect(v).connect(ac.destination); o.start(t); o.stop(t + 0.09);
    });
  } catch (e) {}
}

refresh();
</script>
