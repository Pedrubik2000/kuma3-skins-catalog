<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kuma-chan</title>
<style>
/* Kuma-chan, in the look of a VTuber studio app: pink diagonal stripes between white cloud edges, a column of round
   pastel buttons, white panels with blue pill headers, the girl big on the right. She scolds you on every Again
   (angrier each Again in a row): a Live2D girl when Pictures/anki-scold/live2d.js is on the device
   (tools/scold_live2d.py), else a bear drawn here; her voice when voice.js is there (tools/scold_voice.py). */
:root{--bg:#fff;--ink:#3d2b3a;--blue:#2b9af3;--pink1:#ffd3dc;--pink2:#ffe2e7;--line:#eadce2;
  --c1:#f6877a;--c2:#8fd16a;--c3:#f5c84c;--c4:#ef6fa5;--c5:#f39c5a;--c6:#9a8be0;--red:#f25a5a;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:16px system-ui,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;overflow:hidden;color:var(--ink);
  background:repeating-linear-gradient(135deg,var(--pink1) 0 28px,var(--pink2) 28px 56px)}
/* the cloud edges */
body::before,body::after{content:"";position:fixed;left:0;right:0;height:22px;z-index:3;pointer-events:none;
  background:radial-gradient(circle at 18px 0,#fff 17px,transparent 18px) 0 0/36px 22px repeat-x}
body::before{top:0}
body::after{bottom:0;transform:scaleY(-1)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
main{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;z-index:1}
/* white top strip with dark icons (review, decks) */
.top{flex:none;display:flex;align-items:center;gap:2px;background:#fff;padding:max(4px,env(safe-area-inset-top)) 6px 4px;
  font:700 15px system-ui,sans-serif;box-shadow:0 2px 6px #c9a5b322;position:relative;z-index:4}
.top .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.ib:active{background:#0000000f}
.ib svg{width:24px;height:24px;fill:currentColor}
/* the round pastel buttons (a long press on the column names them) */
.rail{position:absolute;left:12px;top:calc(34px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:12px;z-index:2}
.rb{display:flex;align-items:center;gap:10px}
.rc{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:0 3px 0 #0000001a}
.rc svg{width:26px;height:26px;fill:#fff}
.rc:active{transform:translateY(2px);box-shadow:none}
.rb .tag{background:#fffffff0;border-radius:99px;padding:4px 10px;font:700 12px system-ui,sans-serif;color:var(--ink);opacity:0;transition:opacity .2s}
.rail.show .tag{opacity:1}
.x{width:52px;height:40px;display:grid;place-items:center}
.x svg{width:34px;height:34px;fill:var(--red)}
.lock{position:absolute;top:calc(36px + env(safe-area-inset-top));right:14px;z-index:2;background:#fff;border-radius:10px;padding:7px 12px;
  font:700 13px system-ui,sans-serif;display:flex;gap:6px;align-items:center;box-shadow:0 2px 6px #c9a5b333}
.lock svg{width:16px;height:16px;fill:var(--ink)}
/* the white panels with a blue pill header */
.panel{background:#fff;border-radius:18px;box-shadow:0 4px 14px #c9a5b340;padding:14px 16px}
.hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.hd .pl{background:var(--blue);color:#fff;border-radius:6px;padding:4px 14px;font:700 14px system-ui,sans-serif;max-width:100%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .pl.btn::after{content:" ▾"}
.home{position:absolute;left:12px;right:12px;bottom:calc(26px + env(safe-area-inset-bottom));z-index:2;max-width:520px;margin:0 auto}
.row{display:flex;align-items:baseline;gap:10px}
.num{font:800 54px/1 system-ui,sans-serif;color:var(--blue);font-variant-numeric:tabular-nums}
.lead{font:700 17px/1.3 system-ui,sans-serif}
.meta{font:500 13px/1.4 system-ui,sans-serif;opacity:.7;margin-top:4px}
.go{display:block;width:100%;margin-top:12px;background:var(--blue);color:#fff;border-radius:99px;padding:14px;font:800 18px system-ui,sans-serif;box-shadow:0 3px 0 #1b6fb3}
.go:active{transform:translateY(2px);box-shadow:none}
.go.alt{background:#fff;color:var(--blue);border:2px solid var(--blue);box-shadow:none}
.prog{flex:none;height:5px;background:#fff;position:relative;z-index:4}
.prog i{display:block;height:100%;background:var(--blue);transition:width .3s}
.cardbox{flex:1;min-height:0;position:relative;margin:30px 10px 8px;padding:0;display:flex;flex-direction:column;overflow:hidden}
.cardbox .hd{position:absolute;left:14px;top:12px;z-index:1;margin:0}
/* shared.js's ✎ 🗑 ⋯ on the card (order 🗑 ✎ ⋯), as pastel circles; undo is ours, left of them */
.cardtools{top:8px!important;right:8px!important}
.cardtools>button,.undo{width:40px!important;height:40px!important;border-radius:50%!important;color:transparent!important;font-size:0!important;
  background:var(--c5) center/22px no-repeat!important;box-shadow:0 3px 0 #0000001a}
.cardtools>button:nth-child(1){background-color:var(--c1)!important;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cpath%20fill%3D%22%23fff%22%20d%3D%22M6%2019c0%201.1.9%202%202%202h8c1.1%200%202-.9%202-2V7H6v12zM19%204h-3.5l-1-1h-5l-1%201H5v2h14V4z%22/%3E%3C/svg%3E")!important}
.cardtools>button:nth-child(2){background-color:var(--c2)!important;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cpath%20fill%3D%22%23fff%22%20d%3D%22M3%2017.25V21h3.75L17.81%209.94l-3.75-3.75L3%2017.25zM20.71%207.04a1%201%200%200%200%200-1.41l-2.34-2.34a1%201%200%200%200-1.41%200l-1.83%201.83%203.75%203.75%201.83-1.83z%22/%3E%3C/svg%3E")!important}
.cardtools>button:nth-child(3){background-color:var(--c6)!important;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cpath%20fill%3D%22%23fff%22%20d%3D%22M6%2010c-1.1%200-2%20.9-2%202s.9%202%202%202%202-.9%202-2-.9-2-2-2zm12%200c-1.1%200-2%20.9-2%202s.9%202%202%202%202-.9%202-2-.9-2-2-2zm-6%200c-1.1%200-2%20.9-2%202s.9%202%202%202%202-.9%202-2-.9-2-2-2z%22/%3E%3C/svg%3E")!important}
.cardtools>button:active,.undo:active{transform:translateY(2px);box-shadow:none}
.undo{position:absolute;top:8px;right:152px;z-index:3;display:grid;place-items:center;background:var(--c3)!important}
.undo svg{width:22px;height:22px;fill:#fff}
.undo:disabled{opacity:.35}
#face{flex:1;width:100%;border:0;display:block;background:transparent;border-radius:18px}
.foot{flex:none;padding:0 12px calc(28px + env(safe-area-inset-bottom));display:flex;justify-content:center}
.foot .go{max-width:520px;margin:0}
.rate{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 10px calc(28px + env(safe-area-inset-bottom));max-width:720px;width:100%;margin:0 auto}
.rate button{min-height:62px;border-radius:16px;font:800 16px system-ui,sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 3px 0 #0000001f}
.rate button:active{transform:translateY(2px);box-shadow:none}
.rate button small{font:600 12px system-ui,sans-serif;opacity:.9}
.r1{background:var(--red)}.r2{background:var(--c5)}.r3{background:var(--c2)}.r4{background:var(--blue)}
.list{flex:1;min-height:0;overflow:auto;margin:30px 10px calc(28px + env(safe-area-inset-bottom))}
.list .panel{padding:10px 8px}
.list .hd{padding:4px 8px}
.list button{display:flex;align-items:center;gap:12px;width:100%;padding:12px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:17px;font-weight:600}
.list button:last-child{border-bottom:0}
.list button span{flex:1;min-width:0;overflow-wrap:anywhere}
.list button b{font:800 18px system-ui,sans-serif;color:var(--blue);font-variant-numeric:tabular-nums}
.list button.z{opacity:.45}
.list button.on{background:#eaf5fe;border-radius:10px}
.list button.on::before{content:"";width:34px;height:20px;border-radius:99px;background:var(--blue) radial-gradient(circle at 24px 10px,#fff 7px,transparent 8px);flex:none}
.veil{position:fixed;inset:0;background:#3d2b3a66;z-index:5}
.sheet{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));margin:0 auto;max-width:540px;z-index:6;padding:12px 10px}
.sheet button{display:block;width:100%;padding:13px 10px;font-size:16px;font-weight:600;text-align:left;border-bottom:1px solid var(--line)}
.sheet button:last-child{border-bottom:0}
.msg{flex:1;display:flex;flex-direction:column;justify-content:center;padding:30px 16px}
.msg .panel{display:flex;flex-direction:column;gap:10px;line-height:1.4;max-width:520px;width:100%;margin:0 auto}
.kuma{width:110px;height:110px;flex:none}
.home .kuma{width:76px;height:76px;float:right}
#scold{position:fixed;left:0;right:0;bottom:calc(100px + env(safe-area-inset-bottom));z-index:4;display:flex;align-items:flex-end;gap:6px;padding:0 12px;max-width:560px;margin:0 auto;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
#scold.mad .kuma{animation:shake .4s .3s 2}
#scold .say{flex:1;background:#fff;color:var(--ink);border-radius:18px;padding:12px 14px;font:800 18px/1.25 system-ui,sans-serif;margin-bottom:58px;box-shadow:0 4px 14px #a0607055}
#scold .say::before{content:"Kuma-chan 💢";display:table;background:var(--blue);color:#fff;border-radius:6px;padding:2px 10px;font:700 12px system-ui,sans-serif;margin-bottom:6px}
#scold.happy .say::before{content:"Kuma-chan ♡";background:var(--c4)}
#scold .say small{display:block;font:500 13px/1.3 system-ui,sans-serif;opacity:.65;margin-top:4px}
#girl{position:fixed;display:none;pointer-events:none;z-index:0}
#girl canvas{width:100%;height:100%;display:block}
body.girlhome #girl.on{display:block;left:56px;right:0;top:calc(24px + env(safe-area-inset-top));bottom:calc(200px + env(safe-area-inset-bottom))}
body.scolding #girl.on{display:block;z-index:4;left:0;bottom:calc(92px + env(safe-area-inset-bottom));width:190px;height:250px}
body.scolding.mad #girl.on{animation:shake2 .4s .3s 2}
#scold.g{padding-left:178px}#scold.g .say{margin-bottom:140px}
@keyframes shake2{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pop{from{transform:translateY(140%)}}
@keyframes shake{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@media (min-width:700px){body.girlhome #girl.on{left:30%;bottom:20px}.home{left:96px;right:auto;width:420px;bottom:60px;margin:0}}
@media (prefers-reduced-motion:reduce){.prog i,.rail .tag{transition:none}#scold,#scold .kuma,#girl{animation:none!important}}
</style>

<body data-s="home">
<main id="main"></main>
<div id="layer"></div>
<div id="girl"></div>
<script src="../shared.js"></script>
<script>
// ---------------------------------------------------------------- data: the bridge, or example data in a browser
const mock = (() => {
  const decks = [
    {id: "1", name: "Deutsch", new: 12, learn: 3, due: 51},
    {id: "2", name: "Deutsch::Core 1000", new: 12, learn: 0, due: 28, cards: [
      ["Ich hab keine Ahnung.", "Ich hab keine Ahnung.<hr>I have no idea.<br><i>Ahnung = idea, clue</i>"],
      ["Es ist nicht weit.", "Es ist nicht weit.<hr>It's not far.<br><i>weit = far</i>"]]},
    {id: "3", name: "Deutsch::Grammatik A1", new: 0, learn: 0, due: 5, cards: [["der, die oder das? ___ Tisch", "der Tisch"]]},
    {id: "4", name: "Deutsch::Mined", new: 0, learn: 3, due: 18, cards: [["Wo ist er?", "Wo ist er?<hr>Where is he?"]]},
    {id: "5", name: "English", new: 0, learn: 0, due: 0}, {id: "7", name: "Japanese", new: 0, learn: 0, due: 9, cards: [["雨", "雨<hr>あめ · rain"]]},
    {id: "8", name: "kumapie", new: 0, learn: 0, due: 0}];
  let n = 0;
  const act = {};
  for (let i = 0; i < 371; i++) {
    const t = new Date(Date.now() - 4 * 3600e3 - i * 86400e3), k = t.toISOString().slice(0, 10);
    const r = Math.abs(Math.sin(i * 12.9898) * 43758.5453) % 1;
    if (i < 12 || r > (i < 120 ? .25 : .75)) { const reps = Math.round(20 + r * 140); act[k] = [reps, reps * 9000, Math.round(reps * .7), Math.round(reps * .63)]; }
  }
  return {
    status: () => ({pkg: "example", anki: true, media: true, mediaBase: ""}),
    decks: () => decks.map(({cards, ...d}) => d),
    next(id) {
      const d = decks.find(x => x.id === id), c = d?.cards || decks.find(x => x.name.startsWith(d?.name + "::") && x.cards)?.cards;
      if (!c || !(d.new + d.learn + d.due)) return null;
      const [q, a] = c[n++ % c.length];
      return {nid: String(n), ord: 0, css: ".card{font-size:26px;text-align:center}", q, a, times: ["<10m", "1d", "3d", "8d"]};
    },
    answer() { const d = decks.find(x => x.id === sel); if (d.due) d.due--; else if (d.learn) d.learn--; else if (d.new) d.new--; },
    activity: () => act, today: () => ({cards: 37, seconds: 336}),
    sync() { alert("In the app this asks kuma3 to sync with AnkiWeb."); },
    open() { alert("In the app this opens kuma3."); }, screen(s) { alert(`In the app this opens kuma3's ${s} screen.`); },
    settings() { alert("In the app this opens kuma3 Skins' settings."); }, skins() { alert("In the app this opens the skin picker."); },
    undoLabel: () => sess.done ? "Undo Answer Card" : "", undo: () => 1, setCollapsed() {}, grantAnki() {}, grantMedia() {},
    progressRead: () => ({}), progressWrite() {}, model: () => "browser"
  };
})();
const api = B ? {
  status: () => JSON.parse(B.status()), decks: () => JSON.parse(B.decks()), next: id => JSON.parse(B.next(id)),
  answer: (c, ease, ms) => B.answer(c.nid, c.ord, ease, ms), sync: () => B.sync(), open: () => B.openAnki(),
  activity: () => JSON.parse(B.activity(371)), today: () => JSON.parse(B.today()),
  undoLabel: () => B.undoLabel(), undo: () => B.undo(), setCollapsed: (id, c) => B.setCollapsed(id, c ? 1 : 0),
  settings: () => B.settings(1), skins: () => B.useSkin(""), screen: (s, did) => B.openScreen(s, did ?? ""), grantAnki: () => B.grantAnki(), grantMedia: () => B.grantMedia(),
  progressRead: () => JSON.parse(B.progressRead()), progressWrite: (d, t) => B.progressWrite(d, t), model: () => B.model()
} : mock;

// ---------------------------------------------------------------- state
const store = (k, v) => { try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } };
let st = {}, decks = [], sel = store("scold-deck"), view = "home", card = null, shown = false, shownAt = 0, sheet = null;
let act = null, sess = {done: 0};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, ch => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[ch]));
const deck = () => decks.find(d => d.id === sel);
const left = d => d ? d.new + d.learn + d.due : 0;
const depth = d => d.name.split("::").length - 1;
const short = d => d.name.split("::").at(-1);

// ---------------------------------------------------------------- XP, goal and streak: the shared progress note
// (same rules as Anki XP without its combo: Again 2 XP, Hard/Good/Easy 10). This device's part is "<model>-scold-…"
// = {xp, days: {day: {reps, xp, goal}}}; `g` is every skin's parts merged, so level and streak match the other skins.
let device = store("scold-device"), mine = store("scold-mine") || {xp: 0, days: {}}, others = {}, g;
if (!device) { device = `${api.model()}-scold-${Math.random().toString(36).slice(2, 8)}`; store("scold-device", device); }
function dayKey(back = 0) {   // Anki's day starts at 4 am (the format the other skins use)
  const t = new Date(Date.now() - 4 * 3600e3 - back * 86400e3);
  return `${t.getFullYear()}-${t.getMonth() + 1}-${t.getDate()}`;
}
const isoDay = (back = 0) => { const t = new Date(Date.now() - 4 * 3600e3 - back * 86400e3);
  return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`; };
function merge() {
  const parts = [mine, ...Object.values(others)], days = {};
  for (const p of parts) for (const [k, v] of Object.entries(p.days || {})) {
    const d = days[k] ??= {reps: 0, goal: 0}; d.reps += v.reps | 0; d.goal = Math.max(d.goal, v.goal | 0);
  }
  const goal = parts.map(p => p.goal || [100, 0]).reduce((x, y) => y[1] > x[1] ? y : x)[0];
  const studied = k => (days[k]?.reps || 0) > 0;
  let streak = 0; for (let i = studied(dayKey()) ? 0 : 1; studied(dayKey(i)); i++) streak++;
  return {xp: parts.reduce((n, p) => n + (p.xp | 0), 0), goal, streak, todayDone: studied(dayKey())};
}
g = merge();
function syncGame() { try { const all = api.progressRead(); delete all[device]; others = all; } catch (e) {} g = merge(); }
function saveGame() { g = merge(); store("scold-mine", mine); try { api.progressWrite(device, JSON.stringify(mine)); } catch (e) {} }
const level = xp => Math.floor((Math.sqrt(1 + 0.08 * xp) - 1) / 2);   // level L starts at 50·L·(L+1) XP (Anki XP's)
function score(ease) {
  const xp = ease === 1 ? 2 : 10, t = mine.days[dayKey()] ??= {reps: 0, xp: 0, goal: g.goal};
  t.reps++; t.xp += xp; t.goal = g.goal; mine.xp += xp;
  saveGame();
}

// ---------------------------------------------------------------- numbers for the dashboard
function todayStats() {   // kuma3's own count (every app); an old kuma3: this skin's session
  let t = null; try { t = api.today(); } catch (e) {}
  return t || {cards: sess.done, seconds: 0};
}
function last30() {   // pace (s/card) and retention (passed review-queue cards) over the last 30 days
  let n = 0, ms = 0, rev = 0, ok = 0;
  for (let i = 0; i < 30; i++) { const a = act?.[isoDay(i)]; if (a) { n += a[0]; ms += a[1]; rev += a[2]; ok += a[3]; } }
  return {pace: n ? ms / n / 1000 : 0, retention: rev ? 100 * ok / rev : null};
}
function minutes(cards, t, l30) {   // "about 6 min": today's pace, else the last 30 days', else 8 s a card
  const pace = t.cards >= 10 && t.seconds ? t.seconds / t.cards : l30.pace || 8;
  return Math.max(1, Math.round(cards * pace / 60));
}
// the default deck for the Study button: the last one studied while it has cards, else the one with the most
function smartDeck() {
  if (left(deck())) return deck();
  return decks.filter(d => left(d)).sort((a, b) => left(b) - left(a) || depth(b) - depth(a))[0] ?? null;
}

const ICON = {
  back: "M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z",
  sync: "M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0 0 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74A7.93 7.93 0 0 0 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z",
  replay: "M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z",
  down: "M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z",
  right: "M8.59 16.59 13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z",
  more: "M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z",
  undo: "M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z",

// what she says, in the deck's language (Deutsch… de, Japanese/Chimahon… ja, else en): [line, English], angrier with
// each Again in a row. tools/scold_voice.py reads this block (keep it JSON) and voices every line into voice.js.
const LINES = /*LINES*/{

                   [["Jetzt reicht's. Keine Snacks für dich!", "That's enough. No snacks for you!"], ["Ich bin nicht böse. Ich bin enttäuscht.", "I'm not angry. I'm disappointed."], ["Ich bin fertig mit dir!", "I'm done with you!"]]],
         "praise": [["Na gut. Das war gut. Hmpf.", "Fine. That was good. Hmph."], ["Siehst du? Du kannst es doch!", "See? You can do it!"], ["Besser. Bild dir bloß nichts ein!", "Better. Don't get cocky!"]]},
  "ja": {"scold": [[["ちょっと！今見たばっかりでしょ！", "Hey! We just saw this!"], ["もう〜、また？！", "Geez, again?!"], ["ふん。ちゃんと集中して！", "Hmph. Focus properly!"], ["ちゃんと見てたの？", "Were you even looking?"]],
                   [["二回目？！寝てるの？", "Twice?! Are you asleep?"], ["メモしとくからね。", "I'm writing this down."], ["集中しなさいよ！", "Concentrate!"]],
                   [["もう知らない！おやつ抜きだからね！", "I give up! No snacks for you!"], ["怒ってないよ。がっかりしてるだけ。", "I'm not angry. Just disappointed."], ["バカ！もう知らないんだから！", "Idiot! I don't care anymore!"]]],
         "praise": [["…まあ、今のはよかったわね。ふん。", "…well, that one was good. Hmph."], ["ほら、やればできるじゃない。", "See, you can do it."], ["まあまあね。調子に乗らないでよ！", "Not bad. Don't get cocky!"]]}

const lang = () => /^(Deutsch|German)/i.test(deck()?.name || "") ? "de" : /^(Japanese|日本|Chimahon)/i.test(deck()?.name || "") ? "ja" : "en";
let fails = 0, scoldTimer = 0, busy = false, voice = null;
const any = a => a[Math.floor(Math.random() * a.length)];
// after a rating: Again = she scolds; the first pass after a scolding = grudging praise. Returns her line, or null.
function scold(ease) {
  let mood, line;
  const L = LINES[lang()];
  if (ease === 1) {
    mood = "mad"; line = any(L.scold[Math.min(fails++, 2)]);
    try { navigator.vibrate?.([60, 40, 60]); } catch (e) {}
  } else if (fails) { fails = 0; mood = "happy"; line = any(L.praise); }
  else return null;
  hideScold();
  const el = document.createElement("div");
  el.id = "scold"; el.className = mood + (girl ? " g" : ""); el.innerHTML = `${girl ? "" : kuma(mood)}<div class="say">${esc(line[0])}${line[1] ? `<small>${esc(line[1])}</small>` : ""}</div>`;
  el.onclick = hideScold;
  document.body.append(el);
  if (girl) {   // angrier face each Again in a row
    document.body.classList.add("scolding", mood); girlFit();
    face(mood === "mad" ? ["mad1", "mad2", "mad3"][Math.min(fails - 1, 2)] : "smug");
  }
  scoldTimer = setTimeout(hideScold, mood === "mad" ? 2600 : 1600);
  return line[0];
}
function hideScold() { clearTimeout(scoldTimer); voice?.pause(); $("scold")?.remove(); document.body.classList.remove("scolding", "mad", "happy"); face(""); girlFit(); }

// ---------------------------------------------------------------- the Live2D girl: one canvas, moved by body classes
// live2d.js (on the device, never in this repo) = PixiJS + Cubism Core + pixi-live2d-display + window.SCOLD_MODEL
// {name, json, files: {path: data URL}}; a page here may load a device script but not fetch device files.
let girl = null, girlApp = null, girlTried = false;
// a device script next to live2d.js (Pictures/anki-scold/<name>); ?<key>=<url> in a browser
const deviceScript = (key, name) => new URLSearchParams(location.search).get(key) || st.sprites?.replace(/anki-hunger\/$/, "anki-scold/" + name);
function loadGirl() {
  const src = deviceScript("live2d", "live2d.js");
  if (girlTried || !src) return;
  girlTried = true;
  // her voice (tools/scold_voice.py): window.SCOLD_VOICE = {line: mp3 data URL}; none = she only writes
  const v = deviceScript("voice", "voice.js");
  if (v) { const vs = document.createElement("script"); vs.src = v; document.head.append(vs); }
  const s = document.createElement("script");
  s.src = src;
  s.onload = async () => {
    try {
      const M = window.SCOLD_MODEL, box = $("girl");
      const S = new PIXI.live2d.Cubism4ModelSettings({...M.json, url: M.name});
      S.resolveURL = p => M.files[p];
      girlApp = new PIXI.Application({backgroundAlpha: 0, resizeTo: box, autoDensity: true, resolution: devicePixelRatio});
      box.append(girlApp.view);
      girl = await PIXI.live2d.Live2DModel.from(S, {autoInteract: false});
      girl.anchor.set(.5, 0); girlApp.stage.addChild(girl);
      // her face is set after the idle motion each frame (the model's own expressions only add to the motion's smile)
      girl.internalModel.on("beforeModelUpdate", () => {
        for (const [id, v] of Object.entries(FACES[curFace] || {})) girl.internalModel.coreModel.setParameterValueById(id, v);
      });
      box.classList.add("on"); document.body.classList.add("hasgirl");
      render();
    } catch (e) { console.warn("live2d", e); girl = null; }
  };
  document.head.append(s);
}
// Cubism parameter ids: the standard ones (BrowForm, MouthForm, EyeSmile) plus Mao's (MouthUp/Down/Angry, Cheek)
const ANGRY = {ParamBrowLAngle: -1, ParamBrowRAngle: -1, ParamBrowLForm: -1, ParamBrowRForm: -1, ParamMouthForm: -1, ParamMouthUp: -1, ParamMouthDown: 1};
const FACES = {pout: {...ANGRY, ParamMouthDown: 0}, mad1: ANGRY, mad2: {...ANGRY, ParamMouthAngry: 1, ParamMouthAngryLine: 1},
  mad3: {...ANGRY, ParamMouthAngry: 1, ParamMouthAngryLine: 1, ParamCheek: 1}, smile: {ParamMouthForm: 1, ParamMouthUp: 1},
  smug: {ParamEyeLSmile: 1, ParamEyeRSmile: 1, ParamMouthForm: 1, ParamMouthUp: 1, ParamCheek: 1}};
let curFace = "";
function face(name) { curFace = name; }
// fit her to the box: home = head to the knees, scolding = head and shoulders
function girlFit() {
  if (!girl) return;
  const on = $("girl").offsetWidth > 0;
  if (!on) return girlApp.ticker.stop();
  girlApp.ticker.start(); girlApp.resize();
  const {width: w, height: h} = girlApp.screen, bust = document.body.classList.contains("scolding");
  girl.scale.set(1);
  const k = h / (girl.height * (bust ? .3 : .8));
  girl.scale.set(k); girl.x = w / 2; girl.y = bust ? -h * .12 : 0;
}

// ---------------------------------------------------------------- reviewing
function loadDecks() { decks = api.decks().filter(d => !(d.name === "Default" && !left(d))); }
function refresh() {
  try {
    st = api.status();
    if (!st.pkg || !st.anki || !st.media) { view = "setup"; return render(); }
    if (view === "setup" || view === "error") view = "home";
    loadDecks();
    if (!deck()) sel = null;
    if (view === "review") return nextCard();
    loadGirl();
    try { act = api.activity(); } catch (e) { act = {}; }
    syncGame();
    render();
  } catch (e) { view = "error"; render(); }
}
function pick(id) { sel = id; store("scold-deck", sel); }
function nextCard() { typed = ""; card = sel ? api.next(sel) : null; shown = false; shownAt = Date.now(); render(); }
function reveal() { if (card) { shown = true; render(); } }
function study() { if (!sel) return; view = "review"; sess = {done: 0}; try { nextCard(); } catch (e) { view = "error"; render(); } }
function undoLast() { busy = false; hideScold(); try { if (api.undo()) { loadDecks(); sess.done = Math.max(0, sess.done - 1); nextCard(); } } catch (e) { view = "error"; render(); } }
function leaveDeck() { busy = false; hideScold(); view = "home"; card = null; refresh(); }
function rate(ease) {
  if (!card || !shown || busy) return;
  const ms = Math.min(Date.now() - shownAt, 60000);
  try { api.answer(card, ease, ms); sess.done++; score(ease); loadDecks(); } catch (e) { view = "error"; render(); return; }
  const said = scold(ease), mp3 = said && window.SCOLD_VOICE?.[said];
  if (!mp3) return nextCard();
  // she says it out loud over the answer you just failed; the next card (and its audio) waits for her (tap = skip)
  clearTimeout(scoldTimer); busy = true;
  const go = () => { if (!busy) return; busy = false; hideScold(); if (view === "review") nextCard(); };
  voice = new Audio(mp3); voice.onended = () => setTimeout(go, 250); voice.onerror = go;
  voice.play()?.catch(go);
  setTimeout(go, 8000); $("scold").onclick = go;
}
function away() { if (busy) { busy = false; hideScold(); nextCard(); } }   // the app pauses: stop talking
// Android back: a sheet, then the reviewer; false = the app goes to the skin picker
function back() {
  if (sheet) { sheet = null; render(); return true; }
  if (view === "review") { leaveDeck(); return true; }
  if (view === "decks") { view = "home"; render(); return true; }
  return false;
}
// the gamepad (AnKing layout like the other skins): review X Again, A Hard, Y Good, B Easy (any shows the answer
// first), right/left scroll the card, L1 replay, R1 back; home: up/down the next deck with cards, A or B start
const FACE = {x: 1, a: 2, y: 3, b: 4};
function pad(k) {
  if (sheet) { if (FACE[k]) { sheet = null; render(); } return; }
  if (view === "review") {
    if (k === "r1") return leaveDeck();
    if (!card) { if (FACE[k]) leaveDeck(); return; }
    if (FACE[k]) return shown ? rate(FACE[k]) : reveal();
    if (k === "right" || k === "left") return toCard({t: "scroll", dy: k === "right" ? -240 : 240});
    if (k === "l1") return toCard({t: "replay"});
    return;
  }
  if (view !== "home" && view !== "decks") return;
  const due = decks.filter(d => left(d)).map(d => d.id), at = smartDeck()?.id, step = {up: -1, down: 1}[k];   // up/down: the next deck with cards
  if (step && due.length) { pick(due[(due.indexOf(at) + step + due.length) % due.length]); view = "home"; render(); }
  else if (k === "a" || k === "b") { if (!left(deck())) { const s = smartDeck(); if (s) pick(s.id); } study(); }
}
document.addEventListener("keydown", e => {   // a hardware keyboard: space/enter show the answer, 1-4 answer
  if (view !== "review" || !card) return;
  if (!shown && (e.key === " " || e.key === "Enter")) { e.preventDefault(); reveal(); }
  else if (shown && "1234".includes(e.key)) rate(+e.key);
});
addEventListener("focus", () => { if (view === "home" && !sheet) refresh(); });   // back from kuma3 or another app

// ---------------------------------------------------------------- the card (same as the other skins), on the screen's colour, centred,
// big bold type unless its note type says otherwise
function cardDoc(html, skip, head = "") {
  let first = true;
  html = html.replace(/\[sound:([^\]]+)\]/g, (m, f) => {
    const auto = first && !skip.includes(f); if (auto) first = false;
    const src = esc(encodeURI(f));
    return /\.(mp4|webm|mkv|mov|m4v)$/i.test(f)
      ? `<video src="${src}" controls playsinline ${auto ? "autoplay" : ""}></video>`
      : `<audio src="${src}" controls ${auto ? "autoplay" : ""}></audio>`;
  });
  const css = getComputedStyle(document.body), dark = false;   // always on the white panel
  return `<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><base href="${esc(st.mediaBase)}"><script>(${cardHelper})()<\/script>
${head}<style>body{background:${css.getPropertyValue("--bg")};color:${css.getPropertyValue("--ink")};font:700 30px/1.3 system-ui,sans-serif}html{height:100%}body{box-sizing:border-box;min-height:100%;display:flex;flex-direction:column;justify-content:safe center}hr{width:100%}</style><style>${card.css || ""}</style><style>html,body{margin:0}body{padding:60px 16px 24px}img,video{max-width:100%;height:auto}</style></head>
<body class="card card${card.ord + 1}${dark ? " nightMode night_mode" : ""}">${html}</body></html>`;
}
const sounds = html => [...(html || "").matchAll(/\[sound:([^\]]+)\]/g)].map(m => m[1]);

// Type-the-answer cards: the same box and check as the other skins
const TYPE = /\[\[type:(?:[^\]]*:)?([^\]:]+)\]\]/g;
let typed = "";
const typeQ = html => html.replace(TYPE, `<input id="typeans" value="${esc(typed)}" autocomplete="off" autocapitalize="off" spellcheck="false"
  style="font:inherit;font-size:.7em;width:80%;max-width:20em;flex-basis:auto;text-align:center;color:#000;background:#fff">`);
function typeA(html) {
  let n = 0;
  return html.replace(TYPE, (m, f) => {
    if (n++) return "";
    const want = new DOMParser().parseFromString(card.fields?.[f] ?? "", "text/html").body.textContent.trim();
    const got = typed.trim(), same = got.normalize("NFKC") === want.normalize("NFKC");
    return same ? `<div style="color:#3c3">${esc(want)} ✓</div>`
      : `<div><s style="color:#e33">${esc(got || "–")}</s><br><span style="color:#3c3">${esc(want)}</span></div>`;
  });
}

refresh();
